<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>droply</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.45 Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #eee; }
    button, input, textarea { border: 1px solid #eee; border-radius: 0; background: #000; color: #eee; font: inherit; }
    button { cursor: pointer; padding: 8px 12px; }
    button:hover, button:focus { background: #eee; color: #000; }
    input, textarea { padding: 9px; width: 100%; }
    textarea { min-height: 260px; resize: vertical; font-family: Consolas, monospace; }
    header { border-bottom: 1px solid #444; padding: 18px 24px; display: flex; gap: 16px; align-items: center; justify-content: space-between; }
    h1, h2, p { margin: 0; } h1 { font-size: 20px; font-weight: 600; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .toolbar, .pathbar, .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .toolbar { border-bottom: 1px solid #444; padding-bottom: 16px; margin-bottom: 16px; }
    .pathbar { margin-bottom: 16px; min-height: 36px; }
    .pathbar button { padding: 5px 8px; }
    .muted { color: #999; }
    .status { min-height: 22px; margin: 8px 0 16px; }
    .error { color: #ff6b6b; } .success { color: #4ade80; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #444; padding: 10px 8px; text-align: left; vertical-align: middle; }
    th { border-top: 1px solid #444; font-weight: 600; }
    .name { width: 52%; } .size { color: #999; }
    .file-link { background: none; border: 0; padding: 0; text-align: left; text-decoration: underline; }
    .row-actions { display: flex; justify-content: flex-end; gap: 6px; }
    .danger { color: #ff6b6b; border-color: #ff6b6b; } .danger:hover, .danger:focus { background: #ff6b6b; color: #000; }
    dialog { background: #000; color: #eee; border: 1px solid #eee; border-radius: 0; width: min(680px, calc(100% - 32px)); padding: 0; }
    dialog::backdrop { background: rgba(0,0,0,.7); }
    .dialog-inner { padding: 20px; } .field { margin-bottom: 14px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    #preview { width: min(960px, calc(100% - 32px)); }
    .preview-body { margin: 14px 0; text-align: center; }
    .preview-body img, .preview-body video { max-width: 100%; max-height: 70vh; }
    .preview-body audio { width: 100%; }
    .preview-body iframe { width: 100%; height: 70vh; border: 1px solid #444; background: #fff; }
    @media (max-width: 650px) { header { padding: 14px; } main { padding: 14px; } .name { width: auto; } th:nth-child(2), td:nth-child(2) { display: none; } }
  </style>
</head>
<body>
  <header><h1>droply</h1><span class="muted">GitHub file manager</span></header>
  <main>

    <div class="toolbar">
      <button id="newFolder">+ Thư mục</button><button id="newFile">+ File</button>
      <button type="button" id="uploadButton">↑ Upload</button><input id="upload" type="file" multiple hidden><input id="uploadDir" type="file" multiple hidden webkitdirectory>
      <button id="refresh">↻ Tải lại</button><button id="saveChanges">Lưu thay đổi (0)</button><button id="squash" class="danger">Dọn lịch sử</button>
    </div>
    <div id="status" class="status muted"></div>
    <div id="path" class="pathbar"></div>
    <table><thead><tr><th class="name">Tên</th><th>Loại</th><th>Kích thước</th><th></th></tr></thead><tbody id="listing"></tbody></table>
  </main>

  <dialog id="uploadChoice"><div class="dialog-inner"><h2>Upload</h2><p class="muted">Chọn loại cần upload, hoặc kéo-thả file và thư mục (có thể trộn lẫn) vào trang.</p><div class="actions"><button id="pickFile">Chọn file</button><button id="pickDir">Chọn thư mục</button><button id="cancelPick">Hủy</button></div></div></dialog>
  <dialog id="preview"><div class="dialog-inner"><h2 id="previewTitle"></h2><div id="previewBody" class="preview-body"></div><div class="actions"><button id="previewDownload">Tải</button><button id="previewClose">Đóng</button></div></div></dialog>
  <dialog id="editor"><div class="dialog-inner"><h2 id="editorTitle"></h2><div class="field"><label id="nameLabel" for="entryName">Tên</label><input id="entryName" spellcheck="false"></div><div class="field" id="contentField"><label for="entryContent">Nội dung</label><textarea id="entryContent" spellcheck="false"></textarea></div><div class="actions"><button id="saveEntry">Lưu</button><button id="cancelEntry">Hủy</button></div></div></dialog>
  <script>
    const owner = 't-root', repo = 'droply';
    let token = '', key = '', currentPath = '', mode = 'file';
    const $ = id => document.getElementById(id), api = path => `https://api.github.com/repos/${owner}/${repo}/contents${path?'/'+path:''}`;
    const status = (message, type='muted') => { $('status').textContent = message; $('status').className = `status ${type}`; };
    const headers = () => ({ Accept: 'application/vnd.github+json', ...(token ? { Authorization: `Bearer ${token}` } : {}) });
    const prettySize = n => n == null ? '—' : n < 1024 ? `${n} B` : `${(n/1024).toFixed(1)} KB`;
    function pathParts() { return currentPath ? currentPath.split('/') : []; }
    function renderPath() { const parts = pathParts(); $('path').innerHTML = ''; const home = document.createElement('button'); home.textContent = 'droply'; home.onclick = () => { currentPath=''; load(); }; $('path').append(home); let built=''; parts.forEach(part=>{ built += (built?'/':'')+part; const b=document.createElement('button'); b.textContent=part; const p=built; b.onclick=()=>{currentPath=p;load();}; $('path').append(' / ',b); }); }
    async function load() {
      renderPath(); $('listing').innerHTML=''; status('Đang tải…');
      try { const r=await fetch(api(currentPath),{headers:headers(),cache:'no-store'}); if(!r.ok) throw new Error((await r.json()).message||r.statusText); const items=await r.json(); for(const it of items) if(it.type==='file' && partRe.test(it.name)) legacyParts.add((currentPath?currentPath+'/':'')+it.name); items.push(...await listParts(currentPath)); items.sort((a,b)=>a.type===b.type?a.name.localeCompare(b.name):a.type==='dir'?-1:1); groupParts(items.filter(it=>!hidden.has(queuedPath((currentPath?currentPath+'/':'')+it.name)))).forEach(addRow); showPending(); updatePending(); }
      catch(e) { status(`Không tải được: ${e.message}.`, 'error'); }
    }
    function addRow(item) { if(!currentPath && ((item.name==='none.txt' && item.type==='file') || RESERVED.has(item.name))) return; const tr=document.createElement('tr'), full=currentPath?`${currentPath}/${item.name}`:item.name; const name=document.createElement('button'); name.className='file-link'; name.textContent=item.name; name.onclick=()=>item.type==='dir'?(currentPath=full,load()):openFile(item); const td1=document.createElement('td'); td1.className='name'; td1.append(item.type==='dir'?'[DIR] ':'[FILE] ',name); const td2=document.createElement('td'); td2.textContent=item.parts?`file lớn, ${item.parts.length} phần`:item.type; const td3=document.createElement('td'); td3.className='size'; td3.textContent=item.type==='dir'?'—':prettySize(item.size); const act=document.createElement('td'); act.className='row-actions'; if(item.type==='dir') { const up=document.createElement('button'); up.textContent='Upload'; up.onclick=()=>uploadToFolder(full); act.append(up); } const down=document.createElement('button'); down.textContent='Tải'; down.onclick=()=>downloadNode(item,full).catch(e=>status(`Tải thất bại: ${e.message}`,'error')); const del=document.createElement('button'); del.textContent='Xóa'; del.className='danger'; del.onclick=()=>removeQueued(item,full); const ren=document.createElement('button'); ren.textContent='Đổi tên'; ren.onclick=()=>renameItem(item,full); act.append(down,ren,del); tr.append(td1,td2,td3,act); $('listing').append(tr); }
    // Xem trước ảnh / âm thanh / video / PDF: tải nhị phân, gán lại MIME đúng rồi phát bằng thẻ gốc của trình duyệt (không giải mã UTF-8 như file văn bản).
    const mediaTypes = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', jfif:'image/jpeg', gif:'image/gif', webp:'image/webp', svg:'image/svg+xml', bmp:'image/bmp', ico:'image/x-icon', avif:'image/avif',
      mp3:'audio/mpeg', wav:'audio/wav', ogg:'audio/ogg', oga:'audio/ogg', opus:'audio/ogg', m4a:'audio/mp4', aac:'audio/aac', flac:'audio/flac', weba:'audio/webm',
      mp4:'video/mp4', m4v:'video/mp4', webm:'video/webm', ogv:'video/ogg', mov:'video/mp4', pdf:'application/pdf' };
    const mediaKind = name => { const ext=name.includes('.')?name.split('.').pop().toLowerCase():'', mime=mediaTypes[ext]; return mime ? { mime, tag: mime==='application/pdf'?'iframe':mime.startsWith('image/')?'img':mime.startsWith('audio/')?'audio':'video' } : null; };
    // Các khóa trong hàng chờ thuộc về một file (chính nó hoặc các phần .partNNNN), đã sắp xếp; bỏ qua mục đánh dấu xóa.
    const queuedKeys = full => { const q=queuedPath(full); return [...pending.keys()].filter(k=>pending.get(k)!==null && (k===q || (partRe.test(k) && k.replace(partRe,'$1')===q))).sort(); };
    // Giá trị trong hàng chờ có thể là base64, Blob hoặc {sha} (file đã có trên repo, chỉ đổi đường dẫn).
    async function queuedBlob(v) { if(v instanceof Blob) return v; if(typeof v==='string') return new Blob([Uint8Array.from(atob(v),c=>c.charCodeAt(0))]); return (await fetchPart({url:`https://api.github.com/repos/${owner}/${repo}/git/blobs/${v.sha}`})).blob(); }
    let editOrig = null, previewUrl = '';
    function closePreview() { $('previewBody').innerHTML=''; if(previewUrl) URL.revokeObjectURL(previewUrl); previewUrl=''; }
    async function previewFile(item, full, media) {
      try {
        status(`Đang tải ${item.name}…`);
        const bufs=[], keys=queuedKeys(full);
        if(keys.length && !item.parts) for(const k of keys) bufs.push(await queuedBlob(pending.get(k)));
        else if(item.parts || item.url) for(const p of (item.parts||[item])) bufs.push(await (await fetchPart(p)).blob());
        else throw new Error('file chưa được lưu, hãy bấm "Lưu thay đổi" rồi mở lại');
        const blob=new Blob(bufs,{type:media.mime}); closePreview(); previewUrl=URL.createObjectURL(blob);
        const el=document.createElement(media.tag); el.src=previewUrl; if(media.tag==='audio'||media.tag==='video') el.controls=true; if(media.tag==='img') el.alt=item.name;
        $('previewTitle').textContent=item.name; $('previewBody').append(el); $('previewDownload').onclick=()=>saveBlob(blob,item.name); $('preview').showModal(); status('');
      } catch(e) { status(`Không xem được: ${e.message}`,'error'); }
    }
    $('previewClose').onclick=()=> $('preview').close(); $('preview').addEventListener('close',closePreview);
    async function openFile(item) { const full=(currentPath?currentPath+'/':'')+item.name, media=mediaKind(item.name); if(media) return previewFile(item,full,media); if(item.parts || item.size>1048576) return status('File lớn: chỉ tải xuống, không chỉnh sửa trực tiếp.'); editOrig={name:item.name,sha:item.sha}; const queued=queuedKeys(full); if(queued.length===1 && queued[0]===queuedPath(full)) { try { $('entryContent').value=await (await queuedBlob(pending.get(queued[0]))).text(); mode='edit'; $('editorTitle').textContent='Chỉnh sửa file'; $('entryName').value=item.name; $('editor').showModal(); } catch(e) { status(e.message,'error'); } return; } try { const r=await fetch(api((currentPath?currentPath+'/':'')+item.name),{headers:headers(),cache:'no-store'}); const data=await r.json(); if(!r.ok) throw new Error(data.message); mode='edit'; $('editorTitle').textContent='Chỉnh sửa file'; $('entryName').value=item.name; $('entryContent').value=new TextDecoder('utf-8').decode(Uint8Array.from(atob(data.content.replace(/\n/g,'')),c=>c.charCodeAt(0))); $('editor').showModal(); } catch(e) { status(e.message,'error'); } }
    $('refresh').onclick=()=>load();
    // Batch mode: local changes are committed together through the Git Data API.
    // Keep each base64 Git Blob request small; larger files are stored as parts and reassembled by the UI.
    const SPLIT_AT = 20*1024*1024, CHUNK = 20*1024*1024, partRe = /^(.+)\.part(\d{4})$/;
    const PARTS_DIR = '_parts', legacyParts = new Set(), toRepoPath = p => partRe.test(p) && !legacyParts.has(p) ? PARTS_DIR+'/'+p : p;
    // Các phần .partNNNN nằm gom trong thư mục _parts/ (cấu trúc con giống thư mục gốc); giao diện vẫn thấy chúng cạnh file gốc. Phần cũ nằm cạnh file (legacyParts) vẫn đọc/xóa được.
    async function listParts(dir) { try { return (await gh(`/repos/${owner}/${repo}/contents/${PARTS_DIR}${dir?'/'+dir:''}`)).filter(e=>e.type==='file' && partRe.test(e.name)); } catch(e) { if(/not found/i.test(e.message)) return []; throw e; } }
    async function listDir(dir) { const raw=await gh(`/repos/${owner}/${repo}/contents${dir?'/'+dir:''}`); for(const e of raw) if(e.type==='file' && partRe.test(e.name)) legacyParts.add((dir?dir+'/':'')+e.name); return [...raw, ...await listParts(dir)]; }
    function groupParts(items) { const out=[], groups=new Map(); for(const it of items) { const m=it.type==='file' && it.name.match(partRe); if(!m) { out.push(it); continue; } let g=groups.get(m[1]); if(!g) { g={name:m[1],type:'file',size:0,parts:[]}; groups.set(m[1],g); out.push(g); } g.parts.push(it); g.size+=it.size; } for(const g of groups.values()) g.parts.sort((a,b)=>a.name.localeCompare(b.name)); return out; }
    const pending = new Map(), hidden = new Set(); // pending: path -> chuỗi base64 | Blob (đọc khi lưu) | null (xóa); hidden: mục đã bấm Xóa nhưng chưa lưu, ẩn khỏi giao diện
    const updatePending = () => { $('saveChanges').textContent = `Lưu thay đổi (${pending.size})`; status(pending.size ? `${pending.size} thay đổi đang chờ lưu.` : 'Đã đồng bộ.'); };
    const RESERVED = new Set(['index.html', 'api.html', '.github', '_parts']); // file/thư mục của ứng dụng ở gốc repo: ẩn khỏi danh sách, không cho ghi
    const queuedPath = p => p;
    function queueChange(path, value, refresh=true) { if(value!==null) hidden.delete(path); pending.set(path, value); updatePending(); if(refresh) load(); }
    function showPending() { const here=currentPath?currentPath+'/':''; const virtual=new Map(); for(const [path,value] of pending) { if(value===null || !path.startsWith(here)) continue; const rest=path.slice(here.length), parts=rest.split('/'); if(parts.length>1) virtual.set(parts[0],'dir'); else if(parts[0]==='none.txt' && currentPath) continue; else virtual.set(parts[0].replace(partRe,'$1'),'file'); } for(const [name,type] of virtual) { const exists=[...$('listing').querySelectorAll('.file-link')].some(x=>x.textContent===name); if(!exists) addRow({name,type,size:0}); } }
    function openNew(type) { mode=type; $('editorTitle').textContent=type==='folder'?'Tạo thư mục':'Tạo file'; $('entryName').value=''; $('entryContent').value=''; $('contentField').style.display=type==='folder'?'none':'block'; $('editor').showModal(); }
    $('newFile').onclick=()=>openNew('file'); $('newFolder').onclick=()=>openNew('folder');
    $('saveEntry').onclick=()=>{ const name=$('entryName').value.trim(); if(!name || name.includes('..') || name.startsWith('/')) return status('Tên không hợp lệ.','error'); const rel=(currentPath?currentPath+'/':'')+name; if(mode==='folder') queueChange(queuedPath(rel+'/none.txt'), btoa('')); else { if(mode==='edit' && editOrig && name!==editOrig.name) { const oq=queuedPath((currentPath?currentPath+'/':'')+editOrig.name); hidden.add(oq); if(editOrig.sha) pending.set(oq,null); else pending.delete(oq); } queueChange(queuedPath(rel), btoa(unescape(encodeURIComponent($('entryContent').value)))); } $('editor').close(); };
    $('cancelEntry').onclick=()=> $('editor').close();
    const readB64 = file => new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(rd.result.split(',')[1]);rd.onerror=rej;rd.readAsDataURL(file);});
    async function queueLarge(path, file) { const n=Math.ceil(file.size/CHUNK), names=[]; for(let i=0;i<n;i++) { const p=`${path}.part${String(i+1).padStart(4,'0')}`; names.push(p); queueChange(p,file.slice(i*CHUNK,(i+1)*CHUNK),false); } const cut=path.lastIndexOf('/'), dir=cut<0?'':path.slice(0,cut), base=path.slice(cut+1), pre=dir?dir+'/':''; if(dir) queueChange(pre+'.gitkeep',btoa(''),false); try { for(const e of await listDir(dir)) { const stale=e.name===base || (e.name.startsWith(base+'.part') && /^\.part\d{4}$/.test(e.name.slice(base.length))); if(stale && !names.includes(pre+e.name)) queueChange(pre+e.name,null,false); } } catch(e) { if(!/not found/i.test(e.message)) throw e; } }
    async function queueFiles(items, base) { try { for(const [relative,file] of items) { const path=queuedPath((base?base+'/':'')+relative); if(file.size>SPLIT_AT) await queueLarge(path,file); else queueChange(path,file,false); } } catch(e) { status(`Thêm file thất bại: ${e.message}`,'error'); } load(); }
    $('upload').onchange=$('uploadDir').onchange=async e=>{ const items=[...e.target.files].map(f=>[f.webkitRelativePath||f.name,f]); e.target.value=''; await queueFiles(items,currentPath); };
    $('uploadButton').onclick=()=>{ if(!token) return status('Chưa có token, hãy tải lại trang.','error'); $('uploadChoice').showModal(); };
    $('pickFile').onclick=()=>{ $('uploadChoice').close(); $('upload').click(); };
    $('pickDir').onclick=()=>{ $('uploadChoice').close(); $('uploadDir').click(); };
    $('cancelPick').onclick=()=> $('uploadChoice').close();
    async function walkEntry(entry, prefix, out) { if(entry.isFile) { out.push([prefix+entry.name, await new Promise((res,rej)=>entry.file(res,rej))]); return; } const reader=entry.createReader(); let batch; do { batch=await new Promise((res,rej)=>reader.readEntries(res,rej)); for(const child of batch) await walkEntry(child,prefix+entry.name+'/',out); } while(batch.length); }
    async function dropUpload(e, base) { e.preventDefault(); e.stopPropagation(); if(!token) return status('Chưa có token, hãy tải lại trang.','error'); const entries=[...e.dataTransfer.items].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean), out=[]; try { for(const entry of entries) await walkEntry(entry,'',out); await queueFiles(out,base); } catch(err) { status(`Upload thất bại: ${err.message}`,'error'); } }
    document.addEventListener('dragover', e=>e.preventDefault());
    document.addEventListener('drop', e=>dropUpload(e,currentPath));
    async function removeQueued(item, full, top=true) { if(top && !confirm(`Xóa ${item.name}?`)) return; const path=queuedPath(full); hidden.add(path); for(const p of [...pending.keys()]) if(p===path || p.startsWith(path+'/') || (partRe.test(p) && p.replace(partRe,'$1')===path)) pending.delete(p); try { if(item.type==='dir') { let children=[]; try { children=await listDir(full); } catch(e) { if(!/not found/i.test(e.message)) throw e; } for(const child of children) await removeQueued(child,`${full}/${child.name}`,false); } else if(item.parts) { for(const p of item.parts) { const pp=path+p.name.slice(item.name.length); hidden.add(pp); queueChange(pp,null,false); } } else if(item.sha) queueChange(path,null,false); } catch(e) { hidden.delete(path); return status(`Xóa thất bại: ${e.message}`,'error'); } if(top) { updatePending(); load(); } }
    // Đổi tên = ghi cùng blob (sha) vào đường dẫn mới + xóa đường dẫn cũ, gộp vào cùng một commit khi bấm "Lưu thay đổi". Thư mục đổi tên đệ quy từng file bên trong.
    async function listRemote(full, out) { for(const c of await listDir(full)) { const cp=`${full}/${c.name}`; if(c.type==='dir') await listRemote(cp,out); else out.push([cp,c.sha]); } }
    async function renameItem(item, full) {
      const input=prompt(`Đổi tên "${item.name}" thành:`, item.name); if(input===null) return; const name=input.trim(); if(!name || name===item.name) return;
      if(name.includes('/') || name.includes('\\') || name==='.' || name==='..' || name.toLowerCase()==='.git' || /[\u0000-\u001f\u007f]/.test(name) || partRe.test(name) || (!currentPath && name==='none.txt')) return status('Tên không hợp lệ.','error');
      if([...$('listing').querySelectorAll('.file-link')].some(x=>x.textContent===name)) return status(`Đã có "${name}" trong thư mục này.`,'error');
      const dir=currentPath?currentPath+'/':'', oldQ=queuedPath(full), newQ=queuedPath(dir+name), mv=q=>newQ+q.slice(oldQ.length), remote=[];
      try { status('Đang đổi tên…'); if(item.type==='dir') await listRemote(full,remote); else for(const p of (item.parts||[item])) if(p.sha) remote.push([dir+p.name,p.sha]); }
      catch(e) { if(!/not found/i.test(e.message)) return status(`Đổi tên thất bại: ${e.message}`,'error'); }
      const moved=new Set([oldQ]); hidden.add(oldQ);
      for(const [rp,sha] of remote) { const q=queuedPath(rp), cur=pending.get(q); moved.add(q); hidden.add(q); if(cur!==null) queueChange(mv(q), cur===undefined?{sha}:cur, false); pending.set(q,null); }
      for(const [p,v] of [...pending]) { if(moved.has(p) || v===null) continue; if(p.startsWith(oldQ+'/') || (partRe.test(p) && p.replace(partRe,'$1')===oldQ)) { pending.delete(p); pending.set(mv(p),v); } }
      if(pending.has(oldQ) && pending.get(oldQ)!==null) { pending.set(newQ,pending.get(oldQ)); pending.delete(oldQ); }
      updatePending(); load();
    }
    // Tải thư mục = một file .zip (không nén, giữ nguyên cấu trúc); tải file = file gốc.
    const crcTable=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
    const crc32=b=>{ let c=-1; for(let i=0;i<b.length;i++) c=crcTable[(c^b[i])&255]^(c>>>8); return (c^-1)>>>0; };
    function makeZip(files) { const enc=new TextEncoder(), parts=[], central=[]; let offset=0; for(const [path,data] of files) { const name=enc.encode(path), crc=crc32(data); const lh=new DataView(new ArrayBuffer(30)); lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(12,0x21,true); lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,name.length,true); parts.push(lh,name,data); const ch=new DataView(new ArrayBuffer(46)); ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(14,0x21,true); ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,name.length,true); ch.setUint32(42,offset,true); central.push(ch,name); offset+=30+name.length+data.length; } const size=central.reduce((n,p)=>n+(p.byteLength),0), end=new DataView(new ArrayBuffer(22)); end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,size,true); end.setUint32(16,offset,true); return new Blob([...parts,...central,end],{type:'application/zip'}); }
    function saveBlob(blob, name) { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
    async function fetchPart(item) { const r=await fetch(item.url,{headers:{...headers(),Accept:'application/vnd.github.raw+json'},cache:'no-store'}); if(!r.ok) throw new Error(`${item.name}: ${r.statusText}`); return r; }
    async function collectFiles(full, prefix, out) { for(const child of groupParts(await listDir(full))) { if(child.type==='dir') await collectFiles(`${full}/${child.name}`,prefix+child.name+'/',out); else { const bufs=[]; for(const p of (child.parts||[child])) bufs.push(new Uint8Array(await (await fetchPart(p)).arrayBuffer())); const data=new Uint8Array(bufs.reduce((n,b)=>n+b.length,0)); let o=0; for(const b of bufs) { data.set(b,o); o+=b.length; } out.push([prefix+child.name,data]); } } }
    async function downloadNode(item, full) { if(item.type==='dir') { status(`Đang gom ${item.name}…`); const files=[]; await collectFiles(full,item.name+'/',files); saveBlob(makeZip(files),item.name+'.zip'); status(`Đã tải ${item.name}.zip (${files.length} file).`,'success'); return; } if(item.parts) { const blobs=[]; for(const [i,p] of item.parts.entries()) { status(`Đang tải ${item.name}: phần ${i+1}/${item.parts.length}…`); blobs.push(await (await fetchPart(p)).blob()); } saveBlob(new Blob(blobs),item.name); status(`Đã tải ${item.name}.`,'success'); return; } const data=await gh(`/repos/${owner}/${repo}/contents/${full}`); saveBlob(await (await fetchPart(data)).blob(),item.name); }
    function uploadToFolder(full) { if(!token) return status('Chưa có token, hãy tải lại trang.','error'); currentPath=full; load(); $('uploadChoice').showModal(); }
    async function saveBatch() { if(!token) return status('Chưa có token, hãy tải lại trang.','error'); if(!pending.size) return status('Không có thay đổi cần lưu.'); try { status('Đang tạo một commit…'); const repoInfo=await gh(`/repos/${owner}/${repo}`), branch=repoInfo.default_branch; const ref=await gh(`/repos/${owner}/${repo}/git/ref/heads/${branch}`), parent=await gh(`/repos/${owner}/${repo}/git/commits/${ref.object.sha}`); const tree=[]; let done=0; // sanitize a path that will be sent to the Git Data API
      function sanitizeGitPath(p) {
        let s = String(p).replace(/\\/g, '/').replace(/\/{2,}/g, '/');
        if (s.startsWith('/')) s = s.slice(1);
        const parts = s.split('/');
        const invalid = parts.find(seg => !seg || seg === '.' || seg === '..' || seg.toLowerCase() === '.git' || /[\u0000-\u001f\u007f]/.test(seg));
        if (invalid !== undefined) throw new Error(`Invalid path component "${invalid}" in "${p}"`);
        if (RESERVED.has(parts[0])) throw new Error(`Không được ghi vào "${parts[0]}" (thuộc về ứng dụng).`);
        return parts.join('/');
      }
      const sourcePaths = new Map();
      const normalizedChanges = [...pending].map(([path,content]) => {
        const gitPath = toRepoPath(sanitizeGitPath(path));
        const previousPath = sourcePaths.get(gitPath);
        if(previousPath) throw new Error(`Hai thay đổi trùng đường dẫn sau chuẩn hóa: "${previousPath}" và "${path}"`);
        sourcePaths.set(gitPath,path);
        return [gitPath,content];
      });
      for(const [gitPath,content] of normalizedChanges) { status(`Đang tải lên ${++done}/${pending.size}…`);
        if(content===null) tree.push({path:gitPath,mode:'100644',type:'blob',sha:null}); else if(content.sha) tree.push({path:gitPath,mode:'100644',type:'blob',sha:content.sha}); else { const blob=await gh(`/repos/${owner}/${repo}/git/blobs`,'POST',{content:content instanceof Blob?await readB64(content):content,encoding:'base64'}); tree.push({path:gitPath,mode:'100644',type:'blob',sha:blob.sha}); } }
      let newTree;
      try { newTree=await gh(`/repos/${owner}/${repo}/git/trees`,'POST',{base_tree:parent.tree.sha,tree}); }
      catch(e) { console.error('GitHub rejected these tree paths:', tree.map(entry=>entry.path), e); throw e; }
      const commit=await gh(`/repos/${owner}/${repo}/git/commits`,'POST',{message:`Update droply (${pending.size} changes)`,tree:newTree.sha,parents:[parent.sha]}); await gh(`/repos/${owner}/${repo}/git/refs/heads/${branch}`,'PATCH',{sha:commit.sha,force:false}); pending.clear(); hidden.clear(); updatePending(); await load(); status('Đã lưu bằng một commit.','success'); } catch(e) { status(`Lưu thất bại: ${e.message}`,'error'); } }
    async function gh(path, method='GET', body) { const r=await fetch('https://api.github.com'+path,{method,cache:'no-store',headers:{...headers(),'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})}); const d=await r.json(); if(!r.ok) throw new Error(d.message||r.statusText); return d; }
    // Gom toàn bộ lịch sử thành 1 commit gốc (giữ nguyên nội dung) rồi force-update nhánh. Không hoàn tác được.
    async function squashHistory() { if(!token) return status('Chưa có token, hãy tải lại trang.','error'); if(pending.size && !confirm(`Còn ${pending.size} thay đổi chưa lưu. Chúng sẽ KHÔNG nằm trong commit gộp. Vẫn tiếp tục?`)) return; if(!confirm('Gộp TOÀN BỘ lịch sử của repo thành 1 commit và force-push?\n\nCác commit cũ sẽ mất khỏi nhánh, không hoàn tác được.')) return; try { status('Đang gộp lịch sử…'); const branch=(await gh(`/repos/${owner}/${repo}`)).default_branch, ref=await gh(`/repos/${owner}/${repo}/git/ref/heads/${branch}`), head=await gh(`/repos/${owner}/${repo}/git/commits/${ref.object.sha}`), commit=await gh(`/repos/${owner}/${repo}/git/commits`,'POST',{message:'Initial commit',tree:head.tree.sha,parents:[]}); await gh(`/repos/${owner}/${repo}/git/refs/heads/${branch}`,'PATCH',{sha:commit.sha,force:true}); status('Đã gộp lịch sử thành 1 commit.','success'); } catch(e) { status(`Dọn lịch sử thất bại: ${e.message}`,'error'); } }
    $('saveChanges').onclick=saveBatch; $('squash').onclick=squashHistory;
    // Token: key (không gồm tiền tố github_pat_) nằm trong none.txt ở gốc repo; none.txt bị ẩn khỏi danh sách file.
    const tokenPrefix = 'github_pat_';
    async function loadKey() {
      try {
        const r=await fetch('none.txt',{cache:'no-store'}); if(!r.ok) throw new Error('không tải được none.txt (HTTP '+r.status+')');
        key=(await r.text()).trim(); token=tokenPrefix+key; return true;
      } catch(e) { console.error('Không lấy được key:', e); status(`Không lấy được token: ${e.message}`,'error'); return false; }
    }
    loadKey().then(ok=>ok&&load());
  </script>
</body>
